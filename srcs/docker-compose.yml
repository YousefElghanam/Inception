services:
  nginx:
    restart: always
    build: ./requirements/nginx
    container_name: nginx
    image: nginx:0.1
    ports:
      - "443:443"
    networks:
      - inception

  wordpress:
    restart: always
    build: ./requirements/wordpress
    container_name: wordpress
    image: wordpress:0.1
    networks:
      - inception
    volumes:
      - wordpress:/usr/share/wordpress
    env_file:
      - ./requirements/wordpress/.env

  mariadb:
    restart: always
    build: ./requirements/mariadb
    container_name: mariadb
    image: mariadb:0.1
    networks:
      - inception
    volumes:
      - mariadb:/var/lib/mysql
    env_file:
      - ./requirements/mariadb/.env

networks:
  inception:
    driver: bridge

volumes:

  wordpress:
    name: srcs_wordpress
    driver: local
    driver_opts:
      device: /home/jel-ghna/data/wordpress
      o: bind
      type: none

  mariadb:
    name: srcs_mariadb
    driver: local
    driver_opts:
      device: /home/jel-ghna/data/mariadb
      o: bind
      type: none
